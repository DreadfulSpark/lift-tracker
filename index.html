<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <meta name="theme-color" content="#0f0f0f">
  <title>Lift Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <div id="rest" class="rest hidden">
    <div class="ring-wrap">
      <svg viewBox="0 0 100 100" class="ring">
        <circle cx="50" cy="50" r="44" class="ring-bg"/>
        <circle id="ring-fg" cx="50" cy="50" r="44" class="ring-fg"/>
      </svg>
      <div id="rest-time" class="rest-time">1:30</div>
    </div>
    <div class="rest-mid">
      <div class="rest-label">Rest · up next</div>
      <div id="rest-next" class="rest-next"></div>
    </div>
    <div class="rest-btns">
      <button class="btn small ghost" data-act="rest-add">+30s</button>
      <button class="btn small" data-act="rest-skip">Skip</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="levelup" class="levelup hidden" data-act="close-levelup">
    <div class="levelup-card">
      <div class="levelup-burst"></div>
      <div class="sub">Level up</div>
      <div id="levelup-num" class="levelup-num">2</div>
      <div id="levelup-rank" class="levelup-rank"></div>
      <div class="sub" style="margin-top:12px">Tap to keep going</div>
    </div>
  </div>

  <div id="sheet" class="sheet-bg hidden">
    <div class="sheet">
      <button class="sheet-x" data-act="close-sheet" aria-label="Close">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <nav class="tabs">
    <button data-tab="home"><span class="ico">⌂</span>Home</button>
    <button data-tab="routines"><span class="ico">☰</span>Routines</button>
    <button data-tab="progress"><span class="ico">↗</span>Progress</button>
    <button data-tab="history"><span class="ico">◷</span>History</button>
  </nav>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
