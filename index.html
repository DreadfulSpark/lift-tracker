<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <title>Lift Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <div id="rest" class="rest hidden">
    <div class="ring-wrap">
      <svg viewBox="0 0 100 100" class="ring">
        <circle cx="50" cy="50" r="44" class="ring-bg"/>
        <circle id="ring-fg" cx="50" cy="50" r="44" class="ring-fg"/>
      </svg>
      <div id="rest-time" class="rest-time">1:30</div>
    </div>
    <div class="rest-mid">
      <div class="rest-label">Rest · up next</div>
      <div id="rest-next" class="rest-next"></div>
    </div>
    <div class="rest-btns">
      <button class="btn small ghost" data-act="rest-add">+30s</button>
      <button class="btn small" data-act="rest-skip">Skip</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="levelup" class="levelup hidden" data-act="close-levelup">
    <div class="levelup-card">
      <div class="levelup-burst"></div>
      <div class="sub">Level up</div>
      <div id="levelup-num" class="levelup-num">2</div>
      <div id="levelup-rank" class="levelup-rank"></div>
      <div class="sub" style="margin-top:12px">Tap to keep going</div>
    </div>
  </div>

  <div id="sheet" class="sheet-bg hidden">
    <div class="sheet">
      <button class="sheet-x" data-act="close-sheet" aria-label="Close">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <nav class="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.3 2.6a1 1 0 0 1 1.4 0l8.5 8a1 1 0 0 1-.7 1.7H19v7.2a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H6.5A1.5 1.5 0 0 1 5 19.5v-7.2H3.5a1 1 0 0 1-.7-1.7z"/></svg>Home</button>
    <button data-tab="routines"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="6.5" width="3.5" height="11" rx="1.2"/><rect x="8" y="10.8" width="8" height="2.4" rx="1"/><rect x="16" y="6.5" width="3.5" height="11" rx="1.2"/><rect x="19.5" y="9" width="3" height="6" rx="1"/></svg>Routines</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="4.5" height="8" rx="1.3"/><rect x="9.75" y="8" width="4.5" height="13" rx="1.3"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.3"/></svg>Progress</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 4a1 1 0 0 0-1 1v5.4c0 .3.1.5.3.7l3.5 3.5a1 1 0 0 0 1.4-1.4L13 12V7a1 1 0 0 0-1-1z"/></svg>History</button>
  </nav>

  <script src="brand.js"></script>
  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
